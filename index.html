<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Adult Story Prompt Builder — v0.1 Engine Demo</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:1100px;margin:0 auto;padding:32px;line-height:1.5;background:#111;color:#eee}
    h1,h2{line-height:1.2} section{margin:24px 0;padding:20px;border:1px solid #444;border-radius:12px;background:#181818}
    label{margin-right:16px} input,select,button{font:inherit;padding:8px 10px;margin:4px;background:#222;color:#eee;border:1px solid #555;border-radius:6px}
    button{cursor:pointer} pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0c0c0c;padding:16px;border-radius:8px;max-height:520px;overflow:auto}
    .note{color:#bbb}
  </style>
</head>
<body>
  <h1>Adult Story Prompt Builder</h1>
  <p class="note">v0.1 engine validation build. This page intentionally exposes debug output before the final product UI is built.</p>

  <section>
    <h2>Demo controls</h2>
    <label>Seed <input id="seed" value="demo-001"></label>
    <label>最大玩法強度
      <select id="intensity">
        <option value="1">Light</option>
        <option value="2">Medium</option>
        <option value="3" selected>Heavy</option>
      </select>
    </label>
    <button id="generate">Generate</button>
    <p><a href="lint.html">Fixture lint</a> · <a href="test.html">Regression suite</a> · <a href="explain.html">Explain Panel</a> · <a href="coverage.html">Coverage Lint</a></p>
  </section>

  <section><h2>Compiled prompt preview</h2><pre id="prompt"></pre></section>
  <section><h2>Generation debug</h2><pre id="result"></pre></section>
  <section><h2>Schema validation</h2><pre id="schema"></pre></section>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
