name: PR20 Compiler Smoke

on:
  push:
    branches:
      - fix/post-claude-review-v01

permissions:
  contents: read

jobs:
  compiler-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run compiler smoke tests
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          globalThis.document = { querySelector: () => null };
          const { runCompilerSmokeTests } = await import('./js/compiler-test.js');
          const result = runCompilerSmokeTests();
          console.log(JSON.stringify({ passed: result.passed, failures: result.failures }, null, 2));
          if (!result.passed) process.exit(1);
          NODE
